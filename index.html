<style>
  :root {
    --bg: #0b1030;
    --text: #ffffff;
    --muted: #d6d9ea;
    --btn: #1da1f2;
    --count: #22e04a;
    --ring: #5b3df5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 18px 40px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }

  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    margin: 20px auto 0;
    padding: 4px;
    background: linear-gradient(135deg, var(--ring), #3a7bff);
    box-shadow: 0 0 22px rgba(91, 61, 245, .55);
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; display: block; background: #1b2150;
  }

  h1 { font-size: 28px; font-weight: 700; margin-top: 26px; line-height: 1.25; }
  .count { margin-top: 16px; font-weight: 700; font-size: 17px; color: var(--count); }
  .tag { margin-top: 18px; color: var(--muted); font-size: 17px; line-height: 1.6; }

  .join {
    display: block; width: 100%;
    margin-top: 32px; padding: 15px 10px;
    background: var(--btn); color: #fff;
    border-radius: 10px; text-decoration: none;
    font-size: 18px; font-weight: 600;
    transition: transform .15s, filter .15s;
  }
  .join:hover { filter: brightness(1.08); }
  .join:active { transform: scale(.98); }
  .join:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .redirect { margin-top: 18px; font-size: 14px; color: var(--muted); }

  .desc { margin-top: 44px; text-align: left; }
  .desc h2 { font-size: 19px; margin-bottom: 14px; }
  .desc ul { list-style: none; }
  .desc li { margin-bottom: 11px; font-size: 16px; font-weight: 600; line-height: 1.4; }
  .desc li::before { content: "\2705"; margin-right: 8px; }
</style>

  $("tagline").innerHTML = CONFIG.tagline.map(t => {
    const s = document.createElement("span"); s.textContent = t; return s.outerHTML;
  }).join("<br>");
  $("joinBtn").textContent = "\uD83D\uDE80 " + CONFIG.buttonText;
  $("joinBtn").href = CONFIG.telegramLink;
  CONFIG.points.forEach(p => {
    const li = document.createElement("li"); li.textContent = p; $("points").appendChild(li);
  });
  document.title = CONFIG.name;

  /* Join button click -> Meta Pixel "Subscribe" event, phir Telegram open */
  $("joinBtn").addEventListener("click", function (e) {
    e.preventDefault();
    try { fbq("track", "Subscribe"); } catch (err) {}
    setTimeout(function () { window.location.href = CONFIG.telegramLink; }, 250);
  });

  if (CONFIG.redirectSeconds > 0) {
    let left = CONFIG.redirectSeconds;
    const out = $("redirect");
    const tick = () => {
      out.textContent = "Redirecting in " + left + " seconds...";
      if (left <= 0) { window.location.href = CONFIG.telegramLink; return; }
      left--; setTimeout(tick, 1000);
    };
    tick();
  }
</script>
</body>
</html>
